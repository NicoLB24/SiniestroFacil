# Base en memoria con modo MySQL: se ejecutan las mismas migraciones de Flyway
spring.datasource.url=jdbc:h2:mem:db_denuncias;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Puerto sin servicio escuchando: simula que ms-polizas y ms-talleres estan caidos
servicios.polizas.url=http://localhost:1
servicios.talleres.url=http://localhost:1
