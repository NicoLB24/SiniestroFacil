spring.application.name=ms-auth-usuarios
server.port=${SERVER_PORT:8081}

# --- Conexion a MySQL (db_usuarios) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# El esquema lo crea Flyway; Hibernate solo valida que las entidades calcen con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway: migraciones en src/main/resources/db/migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# En produccion el secreto se entrega por variable de entorno (minimo 32 caracteres)
jwt.secret=${JWT_SECRET:siniestrofacil-clave-secreta-desarrollo-local-2025}
jwt.expiration-seconds=${JWT_EXPIRATION:3600}

# --- Documentacion y monitoreo ---
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
